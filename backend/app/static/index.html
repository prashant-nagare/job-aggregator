<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobScout Pro — Multi-Portal Job Aggregator & AI Resume Matcher</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const PORTAL_COLORS = {
      linkedin: { bg: 'bg-blue-950/60', text: 'text-blue-400', border: 'border-blue-800/60', label: 'LinkedIn' },
      instahyre: { bg: 'bg-purple-950/60', text: 'text-purple-400', border: 'border-purple-800/60', label: 'Instahyre' },
      indeed: { bg: 'bg-indigo-950/60', text: 'text-indigo-400', border: 'border-indigo-800/60', label: 'Indeed' },
      remoteok: { bg: 'bg-emerald-950/60', text: 'text-emerald-400', border: 'border-emerald-800/60', label: 'RemoteOK' },
      glassdoor: { bg: 'bg-amber-950/60', text: 'text-amber-400', border: 'border-amber-800/60', label: 'Glassdoor' },
      naukri: { bg: 'bg-rose-950/60', text: 'text-rose-400', border: 'border-rose-800/60', label: 'Naukri' },
    };

    const STATUS_CONFIG = {
      new: { label: 'New', color: 'bg-slate-700/60 text-slate-300 border-slate-600', dot: 'bg-slate-400' },
      saved: { label: 'Bookmarked', color: 'bg-amber-950/60 text-amber-300 border-amber-700/60', dot: 'bg-amber-400' },
      applied: { label: 'Applied', color: 'bg-blue-950/60 text-blue-300 border-blue-700/60', dot: 'bg-blue-400' },
      interviewing: { label: 'Interviewing', color: 'bg-purple-950/60 text-purple-300 border-purple-700/60', dot: 'bg-purple-400' },
      offer: { label: 'Offer', color: 'bg-emerald-950/60 text-emerald-300 border-emerald-700/60', dot: 'bg-emerald-400' },
      rejected: { label: 'Rejected', color: 'bg-red-950/60 text-red-300 border-red-700/60', dot: 'bg-red-400' },
      not_relevant: { label: 'Not Relevant', color: 'bg-zinc-800/80 text-zinc-400 border-zinc-700', dot: 'bg-zinc-500' },
    };

    const PRESET_ROLES = ["Python Developer", "Full Stack Developer", "Backend Engineer", "Frontend Developer", "DevOps Engineer", "Data Engineer"];
    const COMMON_LOCATIONS = ["Bengaluru", "Hyderabad", "Pune", "Delhi NCR", "Mumbai", "Chennai", "Remote"];
    const EXP_OPTIONS = [
      { id: "0-1", label: "0-1 yrs (Fresher)" },
      { id: "1-3", label: "1-3 yrs (Junior)" },
      { id: "3-5", label: "3-5 yrs (Mid)" },
      { id: "5-8", label: "5-8 yrs (Senior)" },
      { id: "8+", label: "8+ yrs (Lead)" }
    ];

    function App() {
      const [jobs, setJobs] = useState([]);
      const [stats, setStats] = useState({ total: 0, by_status: {}, by_source: {} });
      const [loading, setLoading] = useState(true);
      const [scraping, setScraping] = useState(false);
      const [scrapeMessage, setScrapeMessage] = useState(null);

      // Filters & Search
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStatus, setSelectedStatus] = useState('all');
      const [selectedPortal, setSelectedPortal] = useState('all');
      const [remoteOnly, setRemoteOnly] = useState(false);
      const [viewMode, setViewMode] = useState('feed'); // 'feed' | 'kanban'
      const [filterDateRange, setFilterDateRange] = useState('any');
      const [filterExpRange, setFilterExpRange] = useState('all');
      const [minAiScore, setMinAiScore] = useState('all'); // 'all', '60', '70', '80', '90'
      const [onlyRelevant, setOnlyRelevant] = useState(false);

      // Scraper Form State (Auto-Remembered)
      const [scrapeKeywords, setScrapeKeywords] = useState(["Python Developer"]);
      const [newKeywordInput, setNewKeywordInput] = useState('');
      const [scrapeLocations, setScrapeLocations] = useState(["Bengaluru"]);
      const [openToAllIndia, setOpenToAllIndia] = useState(false);
      const [newLocationInput, setNewLocationInput] = useState('');
      const [scrapeDateRange, setScrapeDateRange] = useState('7d');
      const [scrapeExpRanges, setScrapeExpRanges] = useState(["all"]);
      const [scrapeCount, setScrapeCount] = useState(15);
      const [scrapeSources, setScrapeSources] = useState(['linkedin', 'instahyre', 'indeed', 'remoteok', 'glassdoor']);
      const [linkedinCookie, setLinkedinCookie] = useState('');
      const [naukriCookie, setNaukriCookie] = useState('');
      const [showCookieSettings, setShowCookieSettings] = useState(false);
      const [showScraperPanel, setShowScraperPanel] = useState(false);

      // Auto-Scraper Scheduler State (Every 2h)
      const [autoScrapeEnabled, setAutoScrapeEnabled] = useState(false);
      const [schedulerStatus, setSchedulerStatus] = useState({});
      const [schedulerLoading, setSchedulerLoading] = useState(false);

      // Bulk Selection State
      const [selectedJobIds, setSelectedJobIds] = useState([]);

      // AI Matcher & Resume State
      const [resumeData, setResumeData] = useState({ has_resume: false });
      const [aiConfig, setAiConfig] = useState({ provider: 'gemini', has_key: false, masked_key: '', model: 'gemini-1.5-flash', auto_filter_min_score: 70 });
      const [showResumeModal, setShowResumeModal] = useState(false);
      const [showAiModal, setShowAiModal] = useState(false);
      const [evaluatingAll, setEvaluatingAll] = useState(false);
      const [uploadingResume, setUploadingResume] = useState(false);
      const [resumeUploadError, setResumeUploadError] = useState(null);
      const [resumeAnalysisMethod, setResumeAnalysisMethod] = useState('ai');

      // Manual Profile State (Starts completely blank/clean by default)
      const [resumeTab, setResumeTab] = useState('manual');
      const [manualProfile, setManualProfile] = useState({
        target_title: '',
        resume_headline: '',
        years_of_experience: '',
        notice_period: '',
        preferred_roles: [],
        skills: [],
        tools: [],
        summary: '',
        experiences: [],
        projects: [],
        certifications: [],
        preferred_locations: []
      });
      const [manualRoleInput, setManualRoleInput] = useState('');
      const [manualSkillInput, setManualSkillInput] = useState('');
      const [manualCertInput, setManualCertInput] = useState('');
      const [manualLocInput, setManualLocInput] = useState('');
      const [newToolName, setNewToolName] = useState('');
      const [newToolExp, setNewToolExp] = useState('');
      const [savingManualProfile, setSavingManualProfile] = useState(false);

      // AI Settings Form
      const [aiProviderInput, setAiProviderInput] = useState('gemini');
      const [aiKeyInput, setAiKeyInput] = useState('');
      const [aiModelInput, setAiModelInput] = useState('gemini-1.5-flash');

      // Drawer / Inspection
      const [activeJob, setActiveJob] = useState(null);
      const [notesText, setNotesText] = useState('');
      const [detailLoading, setDetailLoading] = useState(false);
      const [evaluatingSingle, setEvaluatingSingle] = useState(false);

      useEffect(() => {
        fetchJobs();
        fetchStats();
        loadSavedConfig();
        fetchSchedulerStatus();
        fetchResumeInfo();
        fetchAiConfig();

        const timer = setInterval(() => {
          fetchSchedulerStatus();
        }, 30000);
        return () => clearInterval(timer);
      }, []);

      const fetchJobs = async () => {
        setLoading(true);
        try {
          const res = await fetch('/api/jobs?limit=300');
          const data = await res.json();
          setJobs(data.jobs || []);
        } catch (err) {
          console.error('Error fetching jobs:', err);
        } finally {
          setLoading(false);
        }
      };

      const fetchStats = async () => {
        try {
          const res = await fetch('/api/stats');
          const data = await res.json();
          setStats(data);
        } catch (err) {
          console.error('Error fetching stats:', err);
        }
      };

      const loadSavedConfig = async () => {
        try {
          const res = await fetch('/api/config');
          const data = await res.json();
          const cfg = data.config;
          if (cfg) {
            if (cfg.keywords) {
              setScrapeKeywords(Array.isArray(cfg.keywords) ? cfg.keywords : [cfg.keywords]);
            }
            if (cfg.locations) setScrapeLocations(cfg.locations);
            if (cfg.open_to_all_india !== undefined) setOpenToAllIndia(cfg.open_to_all_india);
            if (cfg.date_posted_range) setScrapeDateRange(cfg.date_posted_range);
            if (cfg.exp_ranges) setScrapeExpRanges(cfg.exp_ranges);
            if (cfg.sources) setScrapeSources(cfg.sources);
            if (cfg.results_per_source) setScrapeCount(cfg.results_per_source);
            if (cfg.linkedin_cookie) setLinkedinCookie(cfg.linkedin_cookie);
            if (cfg.naukri_cookie) setNaukriCookie(cfg.naukri_cookie);
          }
        } catch (err) {
          console.error('Error loading config:', err);
        }
      };

      const fetchSchedulerStatus = async () => {
        try {
          const res = await fetch('/api/scheduler/status');
          const data = await res.json();
          setSchedulerStatus(data);
          setAutoScrapeEnabled(Boolean(data.enabled));
        } catch (err) {
          console.error('Error fetching scheduler status:', err);
        }
      };

      const fetchResumeInfo = async () => {
        try {
          const res = await fetch('/api/resume');
          const data = await res.json();
          setResumeData(data);
          if (data.has_resume) {
            if (data.parse_method) {
              setResumeAnalysisMethod(data.parse_method);
            }
            if (data.profile) {
              setManualProfile(prev => ({
                target_title: data.profile.target_title || prev.target_title || '',
                resume_headline: data.profile.resume_headline || prev.resume_headline || '',
                years_of_experience: data.profile.years_of_experience !== undefined ? data.profile.years_of_experience : prev.years_of_experience,
                notice_period: data.profile.notice_period || prev.notice_period || '',
                preferred_roles: data.profile.preferred_roles || prev.preferred_roles || [],
                skills: data.profile.skills || prev.skills || [],
                tools: data.profile.tools || prev.tools || [],
                summary: data.profile.summary || prev.summary || '',
                experiences: data.profile.experiences || prev.experiences || [],
                projects: data.profile.projects || prev.projects || [],
                certifications: data.profile.certifications || prev.certifications || [],
                preferred_locations: data.profile.preferred_locations || prev.preferred_locations || []
              }));
              if (data.parse_method === 'manual') {
                setResumeTab('manual');
              }
            }
          }
        } catch (err) {
          console.error('Error fetching resume info:', err);
        }
      };

      // Manual Profile Helpers
      const addManualSkill = (skillToAdd) => {
        const val = (skillToAdd || manualSkillInput).trim();
        if (val && !manualProfile.skills.includes(val)) {
          setManualProfile(prev => ({ ...prev, skills: [...prev.skills, val] }));
          if (!skillToAdd) setManualSkillInput('');
        }
      };

      const removeManualSkill = (skill) => {
        setManualProfile(prev => ({ ...prev, skills: prev.skills.filter(s => s !== skill) }));
      };

      const addManualRole = () => {
        const val = manualRoleInput.trim();
        if (val && !manualProfile.preferred_roles.includes(val)) {
          setManualProfile(prev => ({ ...prev, preferred_roles: [...prev.preferred_roles, val] }));
          setManualRoleInput('');
        }
      };

      const removeManualRole = (role) => {
        setManualProfile(prev => ({ ...prev, preferred_roles: prev.preferred_roles.filter(r => r !== role) }));
      };

      const addManualCert = () => {
        const val = manualCertInput.trim();
        if (val && !manualProfile.certifications.includes(val)) {
          setManualProfile(prev => ({ ...prev, certifications: [...prev.certifications, val] }));
          setManualCertInput('');
        }
      };

      const removeManualCert = (cert) => {
        setManualProfile(prev => ({ ...prev, certifications: prev.certifications.filter(c => c !== cert) }));
      };

      const addManualLoc = () => {
        const val = manualLocInput.trim();
        if (val && !manualProfile.preferred_locations.includes(val)) {
          setManualProfile(prev => ({ ...prev, preferred_locations: [...prev.preferred_locations, val] }));
          setManualLocInput('');
        }
      };

      const removeManualLoc = (loc) => {
        setManualProfile(prev => ({ ...prev, preferred_locations: prev.preferred_locations.filter(l => l !== loc) }));
      };

      const addManualTool = () => {
        const tname = newToolName.trim();
        if (tname) {
          setManualProfile(prev => ({
            ...prev,
            tools: [...prev.tools, { name: tname, experience_years: newToolExp.trim() || '1' }]
          }));
          setNewToolName('');
          setNewToolExp('');
        }
      };

      const removeManualTool = (idx) => {
        setManualProfile(prev => ({
          ...prev,
          tools: prev.tools.filter((_, i) => i !== idx)
        }));
      };

      const addManualExperience = () => {
        setManualProfile(prev => ({
          ...prev,
          experiences: [...prev.experiences, { company: '', role: '', duration: '', description: '' }]
        }));
      };

      const updateManualExperience = (idx, field, val) => {
        setManualProfile(prev => {
          const updated = [...prev.experiences];
          updated[idx] = { ...updated[idx], [field]: val };
          return { ...prev, experiences: updated };
        });
      };

      const removeManualExperience = (idx) => {
        setManualProfile(prev => ({
          ...prev,
          experiences: prev.experiences.filter((_, i) => i !== idx)
        }));
      };

      const addManualProject = () => {
        setManualProfile(prev => ({
          ...prev,
          projects: [...prev.projects, { title: '', description: '' }]
        }));
      };

      const updateManualProject = (idx, field, val) => {
        setManualProfile(prev => {
          const updated = [...prev.projects];
          updated[idx] = { ...updated[idx], [field]: val };
          return { ...prev, projects: updated };
        });
      };

      const removeManualProject = (idx) => {
        setManualProfile(prev => ({
          ...prev,
          projects: prev.projects.filter((_, i) => i !== idx)
        }));
      };

      const handleSaveManualProfile = async () => {
        if (!manualProfile.target_title && manualProfile.skills.length === 0) {
          alert('Please enter at least a Target Role or a few Key Skills.');
          return;
        }

        setSavingManualProfile(true);
        try {
          const res = await fetch('/api/resume/manual', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(manualProfile)
          });
          const data = await res.json();
          if (res.ok) {
            fetchResumeInfo();
            fetchJobs();
            alert('Profile saved and job scoring started!');
          } else {
            alert(data.detail || 'Failed to save profile.');
          }
        } catch (err) {
          console.error('Error saving manual profile:', err);
          alert('Error saving manual profile.');
        } finally {
          setSavingManualProfile(false);
        }
      };

      const handleClearManualForm = () => {
        if (confirm('Are you sure you want to clear all fields in the manual form?')) {
          setManualProfile({
            target_title: '',
            resume_headline: '',
            years_of_experience: '',
            notice_period: '',
            preferred_roles: [],
            skills: [],
            tools: [],
            summary: '',
            experiences: [],
            projects: [],
            certifications: [],
            preferred_locations: []
          });
          setManualRoleInput('');
          setManualSkillInput('');
          setManualCertInput('');
          setManualLocInput('');
          setNewToolName('');
          setNewToolExp('');
        }
      };

      // Bulk Actions Helpers
      const toggleSelectJob = (jobId) => {
        setSelectedJobIds(prev => 
          prev.includes(jobId) ? prev.filter(id => id !== jobId) : [...prev, jobId]
        );
      };

      const toggleSelectAllFiltered = () => {
        const filteredIds = filteredJobs.map(j => j.id);
        const allSelected = filteredIds.length > 0 && filteredIds.every(id => selectedJobIds.includes(id));
        if (allSelected) {
          setSelectedJobIds(prev => prev.filter(id => !filteredIds.includes(id)));
        } else {
          const union = Array.from(new Set([...selectedJobIds, ...filteredIds]));
          setSelectedJobIds(union);
        }
      };

      const handleBulkStatusChange = async (newStatus) => {
        if (selectedJobIds.length === 0) return;
        try {
          const res = await fetch('/api/jobs/bulk-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ job_ids: selectedJobIds, status: newStatus })
          });
          const data = await res.json();
          if (res.ok) {
            setJobs(prev => prev.map(j => selectedJobIds.includes(j.id) ? { ...j, status: newStatus } : j));
            fetchStats();
            setSelectedJobIds([]);
          } else {
            alert(data.detail || 'Failed to update jobs in bulk.');
          }
        } catch (err) {
          console.error('Error updating bulk status:', err);
          alert('Error updating bulk status.');
        }
      };

      const handleBulkDeleteJobs = async () => {
        if (selectedJobIds.length === 0) return;
        if (!confirm(`Are you sure you want to delete ${selectedJobIds.length} selected job listing(s)?`)) return;
        try {
          const res = await fetch('/api/jobs/bulk-delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ job_ids: selectedJobIds })
          });
          const data = await res.json();
          if (res.ok) {
            setJobs(prev => prev.filter(j => !selectedJobIds.includes(j.id)));
            fetchStats();
            setSelectedJobIds([]);
          } else {
            alert(data.detail || 'Failed to delete selected jobs.');
          }
        } catch (err) {
          console.error('Error deleting bulk jobs:', err);
          alert('Error deleting jobs.');
        }
      };

      const fetchAiConfig = async () => {
        try {
          const res = await fetch('/api/ai/config');
          const data = await res.json();
          setAiConfig(data);
          setAiProviderInput(data.provider || 'gemini');
          setAiModelInput(data.model || (data.provider === 'openai' ? 'gpt-4o-mini' : 'gemini-1.5-flash'));
        } catch (err) {
          console.error('Error fetching AI config:', err);
        }
      };

      const handleSaveAiConfig = async (e) => {
        e?.preventDefault();
        try {
          const res = await fetch('/api/ai/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: aiProviderInput,
              api_key: aiKeyInput,
              model: aiModelInput,
              auto_filter_min_score: 70,
              auto_evaluate_on_scrape: true
            })
          });
          if (res.ok) {
            fetchAiConfig();
            setShowAiModal(false);
            setAiKeyInput('');
          }
        } catch (err) {
          console.error('Error saving AI config:', err);
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.pdf')) {
          setResumeUploadError('Please select a valid PDF file.');
          return;
        }

        setUploadingResume(true);
        setResumeUploadError(null);
        const formData = new FormData();
        formData.append('file', file);
        formData.append('parse_method', resumeAnalysisMethod);

        try {
          const res = await fetch('/api/resume/upload', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (res.ok) {
            fetchResumeInfo();
            fetchJobs();
          } else {
            setResumeUploadError(data.detail || 'Failed to parse resume.');
          }
        } catch (err) {
          setResumeUploadError('Error uploading resume file.');
        } finally {
          setUploadingResume(false);
        }
      };

      const handleReparseResume = async (method) => {
        setUploadingResume(true);
        setResumeUploadError(null);
        try {
          const res = await fetch('/api/resume/reparse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ parse_method: method })
          });
          const data = await res.json();
          if (res.ok) {
            setResumeAnalysisMethod(method);
            fetchResumeInfo();
            fetchJobs();
          } else {
            setResumeUploadError(data.detail || 'Failed to re-analyze resume.');
          }
        } catch (err) {
          setResumeUploadError('Error re-analyzing resume.');
        } finally {
          setUploadingResume(false);
        }
      };

      const handleEvaluateAll = async (method = 'auto') => {
        setEvaluatingAll(true);
        try {
          const res = await fetch(`/api/jobs/evaluate-all?method=${method}`, { method: 'POST' });
          if (res.ok) {
            // Poll jobs to show live updates
            setTimeout(fetchJobs, 2000);
            setTimeout(fetchJobs, 5000);
          }
        } catch (err) {
          console.error('Error evaluating all:', err);
        } finally {
          setTimeout(() => setEvaluatingAll(false), 2500);
        }
      };

      const handleEvaluateSingle = async (jobId) => {
        setEvaluatingSingle(true);
        try {
          const res = await fetch(`/api/jobs/${jobId}/evaluate`, { method: 'POST' });
          const data = await res.json();
          if (res.ok && data.analysis) {
            const an = data.analysis;
            setActiveJob(prev => prev && prev.id === jobId ? { ...prev, ai_score: an.match_score, ai_summary: an.ai_summary, matched_skills: an.matched_skills, missing_skills: an.missing_skills, is_relevant: an.is_relevant } : prev);
            setJobs(prev => prev.map(j => j.id === jobId ? { ...j, ai_score: an.match_score, ai_summary: an.ai_summary, matched_skills: an.matched_skills, missing_skills: an.missing_skills, is_relevant: an.is_relevant } : j));
          }
        } catch (err) {
          console.error('Error evaluating single job:', err);
        } finally {
          setEvaluatingSingle(false);
        }
      };

      const handleDeleteResume = async () => {
        if (!confirm('Are you sure you want to remove your uploaded resume?')) return;
        try {
          await fetch('/api/resume', { method: 'DELETE' });
          fetchResumeInfo();
        } catch (err) {
          console.error('Error deleting resume:', err);
        }
      };

      const toggleAutoScraper = async () => {
        setSchedulerLoading(true);
        const newTarget = !autoScrapeEnabled;
        const currentConfig = {
          keywords: scrapeKeywords,
          locations: openToAllIndia ? ['India'] : scrapeLocations,
          open_to_all_india: openToAllIndia,
          date_posted_range: scrapeDateRange,
          exp_ranges: scrapeExpRanges,
          sources: scrapeSources,
          results_per_source: parseInt(scrapeCount),
          linkedin_cookie: linkedinCookie,
          naukri_cookie: naukriCookie
        };

        try {
          const res = await fetch('/api/scheduler/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              enabled: newTarget,
              scraper_config: currentConfig
            })
          });
          const data = await res.json();
          if (res.ok) {
            setAutoScrapeEnabled(newTarget);
            setSchedulerStatus(data.scheduler);
          }
        } catch (err) {
          console.error('Error toggling scheduler:', err);
        } finally {
          setSchedulerLoading(false);
        }
      };

      const handleScrape = async (e) => {
        e?.preventDefault();
        setScraping(true);
        setScrapeMessage({ type: 'info', text: 'Scraping target portals across roles & locations in parallel... (~5-15s)' });
        try {
          const payload = {
            keywords: scrapeKeywords,
            locations: openToAllIndia ? ['India'] : scrapeLocations,
            open_to_all_india: openToAllIndia,
            date_posted_range: scrapeDateRange,
            exp_ranges: scrapeExpRanges,
            sources: scrapeSources,
            results_per_source: parseInt(scrapeCount),
            linkedin_cookie: linkedinCookie,
            naukri_cookie: naukriCookie
          };

          const res = await fetch('/api/scrape', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            setScrapeMessage({ type: 'success', text: data.message });
            fetchJobs();
            fetchStats();
            fetchSchedulerStatus();
          } else {
            setScrapeMessage({ type: 'error', text: data.detail || 'Failed to scrape' });
          }
        } catch (err) {
          setScrapeMessage({ type: 'error', text: 'Error connecting to scraper server.' });
        } finally {
          setScraping(false);
        }
      };

      const addRoleKeyword = (role) => {
        const clean = role.trim();
        if (clean && !scrapeKeywords.includes(clean)) {
          setScrapeKeywords([...scrapeKeywords, clean]);
        }
      };

      const removeRoleKeyword = (role) => {
        if (scrapeKeywords.length > 1) {
          setScrapeKeywords(scrapeKeywords.filter(k => k !== role));
        }
      };

      const handleCustomRoleSubmit = (e) => {
        if (e.key === 'Enter' || e.type === 'click') {
          e.preventDefault();
          if (newKeywordInput.trim()) {
            addRoleKeyword(newKeywordInput);
            setNewKeywordInput('');
          }
        }
      };

      const toggleExpRange = (expId) => {
        if (expId === 'all') {
          setScrapeExpRanges(['all']);
          return;
        }
        let updated = scrapeExpRanges.filter(e => e !== 'all');
        if (updated.includes(expId)) {
          updated = updated.filter(e => e !== expId);
        } else {
          updated.push(expId);
        }
        if (updated.length === 0) updated = ['all'];
        setScrapeExpRanges(updated);
      };

      const toggleLocationTag = (loc) => {
        if (openToAllIndia) setOpenToAllIndia(false);
        setScrapeLocations(prev => 
          prev.includes(loc) ? prev.filter(l => l !== loc) : [...prev, loc]
        );
      };

      const addCustomLocation = (e) => {
        if (e.key === 'Enter' && newLocationInput.trim()) {
          e.preventDefault();
          const clean = newLocationInput.trim();
          if (!scrapeLocations.includes(clean)) {
            setScrapeLocations([...scrapeLocations, clean]);
          }
          setNewLocationInput('');
        }
      };

      const updateStatus = async (jobId, newStatus, customNotes = null) => {
        try {
          const current = jobs.find(j => j.id === jobId);
          const body = {
            status: newStatus,
            notes: customNotes !== null ? customNotes : (current ? current.notes : '')
          };
          const res = await fetch(`/api/jobs/${jobId}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (res.ok) {
            setJobs(prev => prev.map(j => j.id === jobId ? { ...j, status: newStatus, notes: body.notes } : j));
            if (activeJob && activeJob.id === jobId) {
              setActiveJob(prev => ({ ...prev, status: newStatus, notes: body.notes }));
            }
            fetchStats();
          }
        } catch (err) {
          console.error('Error updating status:', err);
        }
      };

      const loadJobDetails = async (job) => {
        setActiveJob(job);
        setNotesText(job.notes || '');

        if (!job.has_full_description) {
          setDetailLoading(true);
          try {
            const res = await fetch(`/api/jobs/${job.id}/details`);
            const data = await res.json();
            if (res.ok && data.description) {
              setActiveJob(prev => prev && prev.id === job.id ? { ...prev, description: data.description, has_full_description: data.is_full } : prev);
              setJobs(prev => prev.map(j => j.id === job.id ? { ...j, description: data.description, has_full_description: data.is_full } : j));
            }
          } catch (err) {
            console.error('Error loading deep details:', err);
          } finally {
            setDetailLoading(false);
          }
        }
      };

      const deleteJob = async (jobId) => {
        if (!confirm('Are you sure you want to remove this job listing?')) return;
        try {
          const res = await fetch(`/api/jobs/${jobId}`, { method: 'DELETE' });
          if (res.ok) {
            setJobs(prev => prev.filter(j => j.id !== jobId));
            if (activeJob && activeJob.id === jobId) setActiveJob(null);
            fetchStats();
          }
        } catch (err) {
          console.error('Error deleting job:', err);
        }
      };

      const handleQuickApply = (job) => {
        window.open(job.apply_url, '_blank');
        if (job.status === 'new') {
          updateStatus(job.id, 'applied');
        }
      };

      // Filtered Jobs in frontend
      const filteredJobs = useMemo(() => {
        const nowSec = Math.floor(Date.now() / 1000);
        const dateCutoffs = {
          '24h': 86400,
          '3d': 259200,
          '7d': 604800,
          '14d': 1209600,
          '30d': 2592000
        };

        return jobs.filter(job => {
          if (selectedStatus !== 'all' && job.status !== selectedStatus) return false;
          if (selectedPortal !== 'all' && job.source !== selectedPortal) return false;
          if (remoteOnly && !job.is_remote) return false;

          // AI Minimum Match Filter
          if (minAiScore !== 'all') {
            const threshold = parseInt(minAiScore);
            if (job.ai_score === null || job.ai_score === undefined || job.ai_score < threshold) return false;
          }

          if (onlyRelevant && !job.is_relevant) return false;

          // Date Posted Filter
          if (filterDateRange !== 'any' && dateCutoffs[filterDateRange]) {
            const cutoff = nowSec - dateCutoffs[filterDateRange];
            if (job.posted_timestamp && job.posted_timestamp < cutoff) return false;
          }

          // Experience Range Filter
          if (filterExpRange !== 'all') {
            const expRanges = {
              '0-1': [0, 1],
              '1-3': [1, 3],
              '3-5': [3, 5],
              '5-8': [5, 8],
              '8+': [8, 99]
            };
            const [minReq, maxReq] = expRanges[filterExpRange] || [0, 99];
            if (job.exp_min !== null && job.exp_min !== undefined) {
              if (job.exp_min > maxReq) return false;
            }
            if (job.exp_max !== null && job.exp_max !== undefined) {
              if (job.exp_max < minReq) return false;
            }
          }

          // Search query
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const inTitle = job.title?.toLowerCase().includes(q);
            const inCompany = job.company?.toLowerCase().includes(q);
            const inLoc = job.location?.toLowerCase().includes(q);
            const inSkills = job.skills?.some(s => s.toLowerCase().includes(q));
            if (!inTitle && !inCompany && !inLoc && !inSkills) return false;
          }

          return true;
        });
      }, [jobs, selectedStatus, selectedPortal, remoteOnly, filterDateRange, filterExpRange, minAiScore, onlyRelevant, searchQuery]);

      const toggleSource = (src) => {
        setScrapeSources(prev => 
          prev.includes(src) ? prev.filter(s => s !== src) : [...prev, src]
        );
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950">
          {/* Top Navbar */}
          <header className="border-b border-slate-800 bg-slate-900/70 backdrop-blur sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 font-black text-xl text-white">
                  ⚡
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                      JobScout Pro
                    </span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                      AI Powered
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Smart Resume Matching & Multi-Portal Job Tracker</p>
                </div>
              </div>

              {/* Action Buttons: Resume, AI Config, Auto-Scrape, Scraper */}
              <div className="flex items-center gap-2">
                {/* Resume Upload / Status Button */}
                <button
                  type="button"
                  onClick={() => setShowResumeModal(true)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border ${
                    resumeData.has_resume
                      ? 'bg-purple-950/60 border-purple-500/80 text-purple-300 shadow-sm'
                      : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                  }`}
                  title={resumeData.has_resume ? `Resume active: ${resumeData.filename}` : 'Upload your resume PDF to enable AI matching'}
                >
                  <span>📄</span>
                  <span>{resumeData.has_resume ? (resumeData.parse_method === 'manual' ? 'Profile: Active (Manual)' : 'Resume: Active') : 'Profile & Skills'}</span>
                  {resumeData.has_resume && <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>}
                </button>

                {/* AI Settings Button */}
                <button
                  type="button"
                  onClick={() => setShowAiModal(true)}
                  className="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 transition flex items-center gap-1.5"
                  title="Configure Gemini or OpenAI API Key"
                >
                  <span>🤖</span>
                  <span className="hidden sm:inline">{aiConfig.provider === 'openai' ? 'OpenAI' : 'Gemini'}</span>
                  {aiConfig.has_key && <span className="text-[10px] text-emerald-400">✓</span>}
                </button>

                {/* Auto-Scrape Scheduler Badge & Toggle */}
                <button
                  type="button"

                  className={`hidden md:flex px-3 py-1.5 rounded-xl text-xs font-bold transition items-center gap-2 border ${
                    autoScrapeEnabled
                      ? 'bg-emerald-950/60 border-emerald-500/80 text-emerald-300 shadow-md shadow-emerald-500/10'
                      : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                  title={autoScrapeEnabled ? `Auto-scraping every 2h. Next run: ${schedulerStatus.next_run || 'soon'}` : 'Click to enable automatic scraping every 2 hours'}
                >
                  <span className={`w-2 h-2 rounded-full ${autoScrapeEnabled ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`}></span>
                  <span>{autoScrapeEnabled ? 'Auto-Scrape: ON (2h)' : 'Auto-Scrape: OFF'}</span>
                </button>

                <button
                  onClick={() => setShowScraperPanel(!showScraperPanel)}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-xl transition flex items-center gap-1.5 ${
                    showScraperPanel 
                      ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                      : 'bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-500/20'
                  }`}
                >
                  <span>🔍</span>
                  <span>{showScraperPanel ? 'Close Scraper' : 'Scrape'}</span>
                </button>

                <a
                  href="/api/export"
                  download="jobs_export.csv"
                  className="hidden lg:flex px-3 py-1.5 text-xs font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition items-center gap-1.5"
                >
                  <span>📥</span>
                  <span>CSV</span>
                </a>
              </div>
            </div>
          </header>

          {/* Scraper Control Hero Panel (Collapsible) */}
          {showScraperPanel && (
            <div className="border-b border-indigo-900/40 bg-gradient-to-b from-indigo-950/40 to-slate-900/60 p-4 sm:p-6 transition-all">
              <div className="max-w-7xl mx-auto">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                  <div className="flex items-center gap-2">
                    <h3 className="text-sm font-bold uppercase tracking-wider text-indigo-300 flex items-center gap-2">
                      <span>⚡</span> Multi-Portal Live Scraper Engine
                    </h3>
                    <span className="text-[11px] text-emerald-400 bg-emerald-950/50 border border-emerald-800/60 px-2 py-0.5 rounded-full">
                      ✓ Inputs Auto-Saved
                    </span>
                  </div>

                  {/* Auto-Scrape Status Banner */}
                  <div className="flex items-center gap-2 text-xs">
                    <span className="text-slate-400">Scheduled Runs:</span>
                    <button
                      type="button"
                      onClick={toggleAutoScraper}
                      className={`font-semibold px-2 py-0.5 rounded border transition ${
                        autoScrapeEnabled
                          ? 'bg-emerald-900/50 text-emerald-300 border-emerald-700'
                          : 'bg-slate-800 text-slate-400 border-slate-700'
                      }`}
                    >
                      {autoScrapeEnabled ? 'Active (Every 2h)' : 'Disabled'}
                    </button>
                    {schedulerStatus.next_run && autoScrapeEnabled && (
                      <span className="text-[11px] text-slate-400">
                        (Next: {new Date(schedulerStatus.next_run).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })})
                      </span>
                    )}
                  </div>
                </div>

                <form onSubmit={handleScrape} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  {/* Job Role Keywords with + button & Chips */}
                  <div className="md:col-span-4 p-3 rounded-xl bg-slate-900/70 border border-slate-800">
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-xs font-semibold text-slate-300 flex items-center gap-2">
                        <span>🎯 Target Job Roles / Keywords:</span>
                        <span className="text-[11px] text-slate-400 font-normal">Add multiple roles using the + buttons</span>
                      </label>
                      <span className="text-[11px] text-slate-500">{scrapeKeywords.length} active role(s)</span>
                    </div>

                    {/* Active Selected Roles */}
                    <div className="flex flex-wrap items-center gap-1.5 mb-2.5">
                      {scrapeKeywords.map((role) => (
                        <span
                          key={role}
                          className="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white flex items-center gap-1.5 shadow-sm"
                        >
                          <span>{role}</span>
                          {scrapeKeywords.length > 1 && (
                            <button
                              type="button"
                              onClick={() => removeRoleKeyword(role)}
                              className="text-indigo-200 hover:text-white font-black text-[11px]"
                            >
                              ✕
                            </button>
                          )}
                        </span>
                      ))}

                      {/* Custom Role Input with + button */}
                      <div className="inline-flex items-center gap-1">
                        <input
                          type="text"
                          value={newKeywordInput}
                          onChange={(e) => setNewKeywordInput(e.target.value)}
                          onKeyDown={handleCustomRoleSubmit}
                          placeholder="+ Custom role (e.g. React Native)"
                          className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 min-w-[200px]"
                        />
                        <button
                          type="button"
                          onClick={handleCustomRoleSubmit}
                          className="px-2 py-1 rounded-lg bg-indigo-600/80 hover:bg-indigo-600 text-white text-xs font-bold transition"
                        >
                          + Add
                        </button>
                      </div>
                    </div>

                    {/* Quick Preset Role Suggestions */}
                    <div className="flex flex-wrap items-center gap-1 pt-2 border-t border-slate-800/60">
                      <span className="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mr-1">Suggestions:</span>
                      {PRESET_ROLES.map(role => {
                        const isAdded = scrapeKeywords.includes(role);
                        return (
                          <button
                            key={role}
                            type="button"
                            onClick={() => addRoleKeyword(role)}
                            disabled={isAdded}
                            className={`px-2 py-0.5 rounded text-[11px] font-medium border transition ${
                              isAdded
                                ? 'bg-slate-800/40 text-slate-600 border-slate-800 cursor-default'
                                : 'bg-slate-800/80 text-slate-300 border-slate-700 hover:text-white hover:bg-slate-700'
                            }`}
                          >
                            + {role}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Multi-Location Selection Area */}
                  <div className="md:col-span-4 p-3 rounded-xl bg-slate-900/70 border border-slate-800">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
                      <label className="text-xs font-semibold text-slate-300 flex items-center gap-2">
                        <span>📍 Target Locations:</span>
                        <span className="text-[11px] text-slate-400 font-normal">Choose one or more cities, or select Open to All</span>
                      </label>

                      {/* Open to All India Toggle */}
                      <button
                        type="button"
                        onClick={() => {
                          setOpenToAllIndia(!openToAllIndia);
                          if (!openToAllIndia) setScrapeLocations([]);
                        }}
                        className={`px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                          openToAllIndia
                            ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30 ring-1 ring-emerald-400'
                            : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'
                        }`}
                      >
                        <span>🇮🇳</span>
                        <span>Open to All (India)</span>
                      </button>
                    </div>

                    {!openToAllIndia && (
                      <div className="flex flex-wrap items-center gap-1.5">
                        {COMMON_LOCATIONS.map(loc => {
                          const active = scrapeLocations.includes(loc);
                          return (
                            <button
                              key={loc}
                              type="button"
                              onClick={() => toggleLocationTag(loc)}
                              className={`px-2.5 py-1 rounded-lg text-xs font-medium border transition ${
                                active
                                  ? 'bg-indigo-600 border-indigo-500 text-white shadow-sm'
                                  : 'bg-slate-800/80 border-slate-700 text-slate-400 hover:text-slate-200'
                              }`}
                            >
                              <span>{active ? '✓ ' : '+ '}</span>
                              <span>{loc}</span>
                            </button>
                          );
                        })}

                        {/* Custom city input */}
                        <input
                          type="text"
                          value={newLocationInput}
                          onChange={(e) => setNewLocationInput(e.target.value)}
                          onKeyDown={addCustomLocation}
                          placeholder="+ Custom city (Enter)"
                          className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 min-w-[150px]"
                        />
                      </div>
                    )}

                    {openToAllIndia && (
                      <div className="text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 rounded-lg px-3 py-1.5 mt-1">
                        ✓ Scraper will search all jobs available throughout India without restricting to any specific city.
                      </div>
                    )}
                  </div>

                  {/* Multi-Experience Range with + Buttons */}
                  <div className="md:col-span-2 p-3 rounded-xl bg-slate-900/70 border border-slate-800">
                    <label className="block text-xs font-semibold text-slate-300 mb-2">
                      🎓 Experience Range: (Select one or multiple)
                    </label>
                    <div className="flex flex-wrap gap-1.5">
                      <button
                        type="button"
                        onClick={() => toggleExpRange('all')}
                        className={`px-2.5 py-1 rounded-lg text-xs font-medium border transition ${
                          scrapeExpRanges.includes('all')
                            ? 'bg-indigo-600 border-indigo-500 text-white font-bold'
                            : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'
                        }`}
                      >
                        All Experience
                      </button>
                      {EXP_OPTIONS.map(exp => {
                        const active = scrapeExpRanges.includes(exp.id);
                        return (
                          <button
                            key={exp.id}
                            type="button"
                            onClick={() => toggleExpRange(exp.id)}
                            className={`px-2.5 py-1 rounded-lg text-xs font-medium border transition ${
                              active
                                ? 'bg-indigo-600 border-indigo-500 text-white font-bold'
                                : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'
                            }`}
                          >
                            <span>{active ? '✓ ' : '+ '}</span>
                            <span>{exp.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Date Posted Range */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                      📅 Date Posted Range
                    </label>
                    <select
                      value={scrapeDateRange}
                      onChange={(e) => setScrapeDateRange(e.target.value)}
                      className="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                    >
                      <option value="any">Any time</option>
                      <option value="24h">Last 24 Hours</option>
                      <option value="3d">Last 3 Days</option>
                      <option value="7d">Last 7 Days (Past Week)</option>
                      <option value="14d">Last 14 Days (2 Weeks)</option>
                      <option value="30d">Last 30 Days (Past Month)</option>
                    </select>
                  </div>

                  {/* Results Count & Submit */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Results per Portal</label>
                    <select
                      value={scrapeCount}
                      onChange={(e) => setScrapeCount(e.target.value)}
                      className="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 mb-2"
                    >
                      <option value="5">5 jobs / portal (Fastest)</option>
                      <option value="15">15 jobs / portal (Recommended)</option>
                      <option value="30">30 jobs / portal (Deep)</option>
                    </select>

                    <button
                      type="submit"
                      disabled={scraping || scrapeSources.length === 0}
                      className="w-full h-[38px] bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-semibold text-xs rounded-lg shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition"
                    >
                      {scraping ? (
                        <>
                          <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                          <span>Scraping Portals...</span>
                        </>
                      ) : (
                        <>
                          <span>🚀</span>
                          <span>Start Live Scrape</span>
                        </>
                      )}
                    </button>
                  </div>

                  {/* Target Portals Selection */}
                  <div className="md:col-span-4 mt-1">
                    <label className="block text-xs font-medium text-slate-400 mb-2">Select Target Portals:</label>
                    <div className="flex flex-wrap gap-2">

                        {j.ai_score !== null && j.ai_score !== undefined && (
                          <span className={`text-[10px] font-extrabold px-1.5 py-0.2 rounded ${
                            j.ai_score >= 80 ? 'text-emerald-300 bg-emerald-950/80' : 'text-amber-300 bg-amber-950/80'
                          }`}>
                            🎯 {j.ai_score}%
                          </span>
                        )}
                      </div>
                      <h5 className="text-xs font-bold text-white group-hover:text-indigo-300 line-clamp-1 mb-0.5">
                        {j.title}
                      </h5>
                      <p className="text-[11px] text-slate-400 line-clamp-1 mb-2">{j.company}</p>

                      <div className="flex items-center justify-between pt-2 border-t border-slate-800/60">
                        <span className="text-[10px] text-slate-500">📍 {j.location.split(',')[0]}</span>
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            onQuickApply(j);
                          }}
                          className="px-2 py-0.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-[10px] rounded transition"
                        >
                          Apply ↗
                        </button>
                      </div>
                    </div>
                  ))}
                  {colJobs.length === 0 && (
                    <div className="text-center py-8 text-[11px] text-slate-600 border border-dashed border-slate-800/80 rounded-xl">
                      Empty
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
